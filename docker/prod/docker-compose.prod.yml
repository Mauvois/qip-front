services:
  frontend:
    image: qip_front_prod
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: qip_front_prod
    ports:
      - "127.0.0.1:8012:80"
    volumes:
      - qip_static:/srv/qip-static:ro
    networks:
      - qip_backend_net
    restart: unless-stopped

networks:
  qip_backend_net:
    external: true

volumes:
  qip_static:
    external: true
