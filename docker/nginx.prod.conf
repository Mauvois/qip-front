server {
    listen 80;
    server_name qip.taan.ovh;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    location = /deployment-version.txt {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ^~ /static/ {
        alias /srv/qip-static/;
    }

    location ^~ /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://qip_api_prod:80;
    }

    location ~ ^/(signup|login|logout|check_session|password-reset|password-reset-confirm|tag_search|media-detail|generate-signed-url|items|media|posts|events|contacts|attendees|uniques|relationship_labels|tags|users|api-auth|admin)/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://qip_api_prod:80;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
