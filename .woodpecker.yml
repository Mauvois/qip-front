when:
  - branch: staging
    event: [push, manual]

steps:
  test:
    image: node:20-alpine
    commands:
      - npm ci
      - node --test src/*.test.mjs src/views/*.test.mjs
      - npm run build

  build:
    image: docker:29-cli
    depends_on: [test]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --build-arg VCS_REF="$CI_COMMIT_SHA" --label org.opencontainers.image.revision="$CI_COMMIT_SHA" -t "qip_front_prod:$CI_COMMIT_SHA" .

  deploy:
    image: docker:29-cli
    depends_on: [build]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /Users/serveur/docker/qip/ci-state:/ci-state
    commands:
      - apk add --no-cache curl util-linux
      - flock -w 900 /ci-state/deploy.lock sh ci/deploy.sh
